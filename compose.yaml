name: tayyn-hyzmat
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: tayyn
      POSTGRES_DB: tayyn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tayyn -d tayyn"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    image: ${API_IMAGE:-tayyn-api:local}
    environment:
      DATABASE_URL: postgresql://tayyn:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/tayyn
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    image: ${API_IMAGE:-tayyn-api:local}
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://tayyn:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/tayyn
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      SEED_ADMIN_PHONE: ${SEED_ADMIN_PHONE:-+99360000000}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VUE_APP_YANDEX_MAPS_API_KEY: ${VUE_APP_YANDEX_MAPS_API_KEY:-}
    image: ${WEB_IMAGE:-tayyn-web:local}
    environment:
      PORT: 8080
      API_UPSTREAM: http://api:4000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
