apply plugin: 'com.android.application'

// Release signing: read from keystore/keystore.properties, which is
// git-ignored (see .gitignore) and never committed - the actual passwords
// live only on whatever machine builds the release, not in source control.
// Falls back to null (unsigned release build) if the file is missing, so
// `assembleDebug` and CI checkouts without the keystore still work.
def keystorePropertiesFile = rootProject.file('keystore/keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "io.openride.driver"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.openride.driver"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Increment packaged app versions before distributing updates.
        // The active Vue app has no automatic APK updater; see docs/android.md.
        versionCode 11
        versionName "1.10"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file("keystore/${keystoreProperties['storeFile'].minus('../keystore/')}")
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
            resValue "string", "app_name", "Tayyn Hyzmat Test"
            resValue "string", "title_activity_main", "Tayyn Hyzmat Test"
        }
        release {
            // R8 code shrinking + obfuscation, and unused-resource removal -
            // both meaningfully cut the final APK size and, since R8 renames
            // classes/methods, make the compiled app harder to decompile
            // back into readable source than an unminified build would be.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    // Default Gradle output is "app-debug.apk" / "app-release.apk" (the
    // module's own directory name, unrelated to the user-facing app name in
    // strings.xml#app_name) - renamed here so the .apk file itself, once
    // pulled off outputs/apk/, reads "Tayyn Hyzmat" too.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "TayynHyzmat-${variant.buildType.name}.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
