name: Publish container images
on:
  workflow_dispatch:
    inputs:
      offline_bundle:
        description: Build offline Ubuntu artifacts instead of publishing images
        type: boolean
        default: false
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: ${{ !inputs.offline_bundle }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signatures and provenance for pushed images
      attestations: write
    strategy:
      matrix:
        include:
          - name: web
            context: .
            file: deploy/Dockerfile.web
          - name: api
            context: backend
            file: backend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
      - uses: sigstore/cosign-installer@v3
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # Public browser key; server geocoder credentials never belong in builds.
          build-args: |
            VUE_APP_YANDEX_MAPS_API_KEY=${{ vars.VUE_APP_YANDEX_MAPS_API_KEY }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Sign image by digest
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}-${{ matrix.name }}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
  offline-bundle:
    if: ${{ inputs.offline_bundle }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/offline-production-bundle.yml
