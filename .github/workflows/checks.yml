name: Checks
on:
  pull_request:
  push:
    branches: [main, "dev/**", "modernize/**"]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment diagnostic behavior
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Check production shell syntax
        run: for script in scripts/production/*.sh; do bash -n "$script"; done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter openride-backend prisma:generate
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm build:driver
        env:
          VITE_API_URL: https://api.example.invalid/api
          VITE_SOCKET_URL: https://api.example.invalid
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: false
          load: true
          tags: tayyn-web-check
          cache-from: type=gha,scope=modern-web
          cache-to: type=gha,mode=max,scope=modern-web
      - run: docker build -t tayyn-api-check backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-container-startup.mjs

  production-backup-drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated restore tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes age
          docker pull postgres:17-bookworm
      - name: Verify encrypted backup, restore and tamper rejection
        run: python3 -m unittest discover -s scripts/tests -p 'test_production_backup_integration.py' -v
        env:
          TAYYN_PRODUCTION_BACKUP_DRILL: "1"
      - name: Verify scoped rollout reset, preservation and transaction rollback
        run: python3 -m unittest discover -s scripts/tests -p 'test_production_reset*.py' -v
        env:
          TAYYN_PRODUCTION_RESET_DRILL: "1"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      # Build-only placeholders; device testing needs the matching isolated API and native CORS origin.
      - run: pnpm cap:sync
        env:
          VITE_API_URL: https://api.example.invalid/api
          VITE_SOCKET_URL: https://api.example.invalid
      - run: cd android && sh ./gradlew :app:assembleDebug :app:testDebugUnitTest

  production-offline-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable Ubuntu resolver fixture
        run: docker pull --platform linux/amd64 ubuntu:24.04
      - name: Verify offline package installation preserves provider SSH and init
        run: python3 -m unittest discover -s scripts/tests -p 'test_offline_packages_integration.py' -v
        env:
          TAYYN_OFFLINE_APT_INTEGRATION: "1"
