name: Checks
on:
  pull_request:
  push:
    branches: [main, "dev/**", "modernize/**"]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter openride-backend prisma:generate
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm build:driver
        env:
          VITE_API_URL: https://api.example.invalid/api
          VITE_SOCKET_URL: https://api.example.invalid
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: false
          load: true
          tags: tayyn-web-check
          cache-from: type=gha,scope=modern-web
          cache-to: type=gha,mode=max,scope=modern-web
      - run: docker build -t tayyn-api-check backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-container-startup.mjs

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      # Build-only placeholders; device testing needs the matching isolated API and native CORS origin.
      - run: pnpm cap:sync
        env:
          VITE_API_URL: https://api.example.invalid/api
          VITE_SOCKET_URL: https://api.example.invalid
      - run: cd android && sh ./gradlew :app:assembleDebug :app:testDebugUnitTest
